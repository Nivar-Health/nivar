# Supabase CLI project settings. Only the parts Nivar relies on are set here; `supabase db push`
# applies ./migrations to the linked cloud project.
[auth]
enable_signup = true

[auth.sms]
enable_signup = true
enable_confirmations = false

# Demo and test numbers with a fixed OTP, so no SMS provider is needed for local or demo use.
# The cloud project needs the same numbers under Authentication, Providers, Phone.
[auth.sms.test_otp]
919876543210 = "123456"
919123400001 = "123456"
919123400002 = "123456"

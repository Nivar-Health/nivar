services:
  mongo:
    image: mongo:7
    container_name: nivar-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - nivar-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nivar-mongo-data:
